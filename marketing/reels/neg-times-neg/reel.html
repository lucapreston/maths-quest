<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Maths Quest Reel</title>
<script src="../lib/three.min.js"></script>
<script src="../lib/kit.js"></script>
</head>
<body>
<script>
const K = Kit, { prog, smooth, outBack, outCubic, lerp, C } = K;

// shots live at different heights; the camera whips between them
const Y2 = -14, Y3 = -28, Y4 = -42;

const S = K.stage({
  duration: 25.5,
  captions: [
    [0.0, 1.5, `Why does a <span class="neg">negative</span> × <span class="neg">negative</span>`],
    [1.5, 3.0, `make a <span class="pos">positive?</span>`],
    [3.0, 3.6, `Watch the <span class="gold">pattern.</span>`],
    [3.6, 4.4, `3 × <span class="neg">−2</span> = <span class="neg">−6</span>`],
    [4.4, 5.2, `2 × <span class="neg">−2</span> = <span class="neg">−4</span>`],
    [5.2, 6.0, `1 × <span class="neg">−2</span> = <span class="neg">−2</span>`],
    [6.0, 6.8, `0 × <span class="neg">−2</span> = 0`],
    [6.8, 7.8, `−1 × <span class="neg">−2</span> = <span class="gold">?</span>`],
    [7.8, 8.8, `−1 × <span class="neg">−2</span> = <span class="pos">2</span>`],
    [8.8, 9.8, `−2 × <span class="neg">−2</span> = <span class="pos">4</span>`],
    [9.8, 11.2, `Every step is <span class="pos">+2.</span> It doesn't <span class="gold">stop at zero.</span>`],
    [11.2, 12.6, `<span class="neg">−</span> × <span class="neg">−</span> = <span class="pos">+</span>`],
    [12.6, 14.1, `Think of <span class="neg">× −1</span> as a <span class="gold">turn.</span>`],
    [14.1, 15.7, `× −1 → facing <span class="neg">backwards.</span>`],
    [15.7, 17.2, `× −1 again → <span class="pos">forwards.</span>`],
    [17.2, 18.4, `Two negatives make a <span class="pos">positive.</span>`],
    [18.6, 20.0, `Do your <span class="gold">5 a day.</span>`, 1500],
    [20.0, 21.9, `8,000+ real <span class="gold">GCSE &amp; A-level</span> exam questions.`, 1500],
    [21.9, 23.0, `Every answer <span class="gold">explained.</span>`, 1500],
    [23.0, 25.51, `Maths <span class="gold">Quest</span>`, 1440],
  ],
});
const { scene } = S;

// ---------- shot 1: two minus bars become a plus ----------
const hook = new THREE.Group(); scene.add(hook);
const barMat = [K.mats.glossy(C.neg), K.mats.glossy(C.neg)];
const barL = new THREE.Mesh(K.roundedBox(2.2, 0.5, 0.5, 0.2), barMat[0]);
const barR = new THREE.Mesh(K.roundedBox(2.2, 0.5, 0.5, 0.2), barMat[1]);
const times = new THREE.Group();
[1, -1].forEach(s => { const m = new THREE.Mesh(K.roundedBox(0.9, 0.16, 0.16, 0.07), K.mats.gold()); m.rotation.z = s * Math.PI / 4; times.add(m); });
hook.add(barL, barR, times);
const negCol = new THREE.Color(C.neg), posCol = new THREE.Color(C.pos);

// ---------- number line builder (shots 2 and 3) ----------
function numberLine(y, from, to) {
  const g = new THREE.Group(); g.position.y = y;
  const len = to - from + 1.2;
  const bar = new THREE.Mesh(K.roundedBox(len, 0.22, 0.6, 0.08), K.mats.navy());
  bar.position.x = (from + to) / 2; g.add(bar);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(len - 0.1, 0.05, 0.05), K.mats.gold());
  edge.position.set((from + to) / 2, 0.11, 0.3); g.add(edge);
  for (let v = from; v <= to; v++) {
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.06, v % 2 ? 0.22 : 0.4, 0.06), K.mats.gold());
    tick.position.set(v, 0.2, 0.15); g.add(tick);
    if (v % 2 === 0) {
      const lab = K.plane(0.9, 0.6, 180, 120, (c, w, h) => {
        c.font = '800 84px "JetBrains Mono"'; c.textAlign = "center"; c.fillStyle = v === 0 ? "#f5f6fa" : "#9aa0b6";
        c.fillText(v < 0 ? "−" + -v : String(v), w / 2, 92);
      });
      lab.position.set(v, -0.55, 0.32); g.add(lab);
    }
  }
  scene.add(g); return g;
}

// ---------- shot 2: the pattern ----------
numberLine(Y2, -7, 7);
const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.12, 48), K.mats.gold());
coin.rotation.x = Math.PI / 2; scene.add(coin);
const coinFace = K.plane(0.6, 0.6, 128, 128, (c) => { c.font = '900 92px "Inter Display"'; c.textAlign = "center"; c.fillStyle = "#6b4c10"; c.fillText("×", 64, 96); });
coinFace.position.z = 0.08; coinFace.rotation.x = -Math.PI / 2; coin.add(coinFace);
const STOPS = [[3.6, -6], [4.4, -4], [5.2, -2], [6.0, 0], [7.8, 2], [8.8, 4]];
const HOP = 0.45;
const trail = STOPS.map(([, v]) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), K.mats.glossy(v < 0 ? C.neg : v > 0 ? C.pos : C.ink));
  m.position.set(v, Y2 + 0.45, 0.2); scene.add(m); return m;
});
const plus2 = STOPS.slice(1).map(([, v]) => {
  const p = K.plane(0.6, 0.34, 160, 90, (c) => { c.font = '800 70px Inter'; c.textAlign = "center"; c.fillStyle = "#4ff0a0"; c.fillText("+2", 80, 72); });
  p.position.set(v - 1, Y2 + 1.75, 0.2); scene.add(p); return p;
});
const qMark = K.plane(0.9, 1.2, 180, 240, (c) => { c.font = '900 220px "Inter Display"'; c.textAlign = "center"; c.fillStyle = "#ffd23f"; c.fillText("?", 90, 200); });
qMark.position.set(2, Y2 + 1.0, 0.2); scene.add(qMark);
function coinPos(t) {
  if (t < STOPS[0][0]) { const p = outCubic(prog(t, 3.15, 3.6)); return [-6, Y2 + 0.75 + (1 - p) * 4, 0.2, 0]; }
  let x = -6, y = Y2 + 0.75, spin = 0;
  for (let k = 1; k < STOPS.length; k++) {
    const [at, v] = STOPS[k], a = at - HOP;
    if (t >= a) {
      const p = smooth(prog(t, a, at));
      x = lerp(STOPS[k - 1][1], v, p); y = Y2 + 0.75 + Math.sin(p * Math.PI) * 1.2; spin = p * Math.PI * 2;
    }
  }
  return [x, y, 0.2, spin];
}
S.ring(6.9, 7.75, () => [2, Y2 + 1.0, 0.2], 130);

// ---------- shot 3: the turning arrow ----------
numberLine(Y3, -4, 4);
const arrow = new THREE.Group(); arrow.position.set(0, Y3 + 0.95, 0.15); scene.add(arrow);
const arrowMat = K.mats.gold();
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.3, 32), arrowMat);
shaft.rotation.z = Math.PI / 2; shaft.position.x = 1.15;
const head = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.75, 40), arrowMat);
head.rotation.z = -Math.PI / 2; head.position.x = 2.65;
const hub = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 16), arrowMat);
arrow.add(shaft, head, hub);
const arc = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.035, 12, 96, Math.PI), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0 }));
arc.rotation.x = Math.PI / 2; arc.position.set(0, Y3 + 0.95, 0.15); scene.add(arc);
const goldCol = new THREE.Color(C.gold);

// ---------- shot 4: the app ----------
const APP = { start: 19.9, push: 20.0, wrong: 20.9, right: 22.0 };
const quiz = K.mqQuestion({
  question: [[["Work out ", "sans"], ["(−3) × (−4) − 5", "serif"]]],
  options: [{ text: "−17" }, { text: "7" }, { text: "17" }, { text: "−7" }],
  why: ["Not quite", "(−3) × (−4) = +12, so 12 − 5 = 7"],
  good: ["Nice one!", "Two negatives make a positive."],
});
const ph = K.phone(() => {}); ph.scale.setScalar(0.92); scene.add(ph);
let screen = () => {}, brand;
S.ring(19.4, 20.1, () => K.screenPoint(ph, ...brand.startPoint), 115);
S.ring(APP.wrong, APP.wrong + 0.8, () => K.screenPoint(ph, ...quiz.markPoint(0)), 60);
S.ring(APP.right, APP.right + 0.9, () => K.screenPoint(ph, ...quiz.markPoint(1)), 60);
const btn = K.el("div", "btn", S.ov, "Get Maths Quest free"); btn.style.top = "1620px";
const bio = K.el("div", "cap dim", S.ov, "link in bio"); bio.style.cssText += "top:1790px;font-size:36px;font-weight:600";

const CAM = [
  { t: 0, pos: [0, 0.4, 15], look: [0, 0, 0] },
  { t: 2.9, pos: [1.0, 0.3, 11.5], look: [0, 0, 0] },
  { t: 3.4, pos: [-4.5, Y2 + 1.8, 11], look: [-4.5, Y2 + 0.5, 0], dur: 0.5 },
  { t: 6.4, pos: [-1, Y2 + 1.8, 11.5], look: [-1, Y2 + 0.5, 0] },
  { t: 7.0, pos: [1.8, Y2 + 1.3, 7.5], look: [1.8, Y2 + 0.8, 0], dur: 0.6 },
  { t: 9.6, pos: [2.6, Y2 + 1.6, 9.5], look: [2.6, Y2 + 0.6, 0] },
  { t: 10.8, pos: [-12, Y2 + 5, 17], look: [0.5, Y2, 0], dur: 1.2 },
  { t: 13.1, pos: [5, Y3 + 3, 14], look: [0.6, Y3 + 0.7, 0], dur: 0.5 },
  { t: 18.4, pos: [-4.5, Y3 + 2.6, 14], look: [0.4, Y3 + 0.7, 0] },
  { t: 19.1, pos: [0, Y4 + 0.6, 16], look: [0, Y4 + 0.9, 0], dur: 0.6 },
  { t: 25.5, pos: [0, Y4 + 0.6, 15.4], look: [0, Y4 + 0.9, 0] },
];

S.onFrame(t => {
  S.camPath(t, CAM);

  // shot 1
  const merge = smooth(prog(t, 1.7, 2.35));
  const spin = t * 0.5;
  barL.position.set(lerp(-1.35, 0, merge), Math.sin(t * 2) * 0.08, 0);
  barR.position.set(lerp(1.35, 0, merge), Math.sin(t * 2 + 1) * 0.08, 0);
  barL.rotation.set(0, Math.sin(spin) * 0.35, 0);
  barR.rotation.set(0, Math.sin(spin) * 0.35, outBack(prog(t, 2.0, 2.5)) * Math.PI / 2);
  times.scale.setScalar(Math.max(0.001, 1 - outCubic(prog(t, 1.6, 2.0))));
  times.rotation.z = t * 1.2;
  barMat.forEach(m => { m.color.copy(negCol).lerp(posCol, prog(t, 2.1, 2.5)); m.emissive.copy(m.color); });
  const pulse = Math.sin(prog(t, 2.35, 2.8) * Math.PI) * 0.25;
  hook.scale.setScalar(1 + pulse);
  hook.rotation.y = merge * Math.sin(t * 0.8) * 0.4;

  // shot 2
  const [cx, cy, cz, cs] = coinPos(t);
  coin.position.set(cx, cy, cz); coin.rotation.set(Math.PI / 2, 0, 0); coin.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), cs + 0.7 + Math.sin(t * 1.5) * 0.3);
  trail.forEach((m, i) => m.scale.setScalar(Math.max(0.001, outBack(prog(t, STOPS[i][0], STOPS[i][0] + 0.3)))));
  plus2.forEach((p, i) => { const a = STOPS[i + 1][0] - HOP * 0.6; p.material.opacity = prog(t, a, a + 0.25); p.position.y = Y2 + 1.75 + (1 - outCubic(prog(t, a, a + 0.35))) * -0.4; });
  qMark.material.opacity = Math.min(prog(t, 6.8, 7.0), 1 - prog(t, 7.5, 7.7));
  qMark.scale.setScalar(1 + Math.sin(t * 8) * 0.06);

  // shot 3
  const f1 = outBack(prog(t, 14.2, 15.0)), f2 = outBack(prog(t, 15.8, 16.6));
  arrow.rotation.y = (f1 + f2) * Math.PI;
  // gold → red when it turns backwards → green when it turns forwards again
  if (t < 16.0) arrowMat.color.copy(goldCol).lerp(negCol, prog(t, 14.4, 14.9));
  else arrowMat.color.copy(negCol).lerp(posCol, prog(t, 16.0, 16.5));
  arrowMat.metalness = 0.9 - 0.5 * prog(t, 14.4, 14.9);
  arc.material.opacity = Math.max(Math.sin(prog(t, 14.2, 15.2) * Math.PI), Math.sin(prog(t, 15.8, 16.8) * Math.PI)) * 0.9;
  arc.rotation.z = t > 15.5 ? Math.PI : 0;
  arrow.position.y = Y3 + 0.95 + Math.sin(t * 2) * 0.04;

  // shot 4
  const fly = outCubic(prog(t, 18.5, 19.4));
  ph.position.set(0, Y4 - (1 - fly) * 7 + Math.sin(t * 1.4) * 0.08, (1 - fly) * -3);
  ph.rotation.set((1 - fly) * 0.6, lerp(1.4, -0.22, fly) + prog(t, 19.4, 25.5) * 0.3, (1 - fly) * 0.25);
  screen(t);
  const b = prog(t, 23.1, 23.5);
  btn.style.opacity = b; bio.style.opacity = b;
  btn.style.transform = `scale(${0.8 + 0.2 * outBack(b) + (t > 23.5 ? Math.sin((t - 23.5) * 4) * 0.025 : 0)})`;
});
K.loadBrand("../lib/").then(b => { brand = b; screen = K.mqScript(ph, quiz, b.fiveADay, APP); S.start(); });
</script>
</body>
</html>
