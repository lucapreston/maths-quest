<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Maths Quest Reel</title>
<script src="../lib/three.min.js"></script>
<script src="../lib/kit.js"></script>
</head>
<body>
<script>
const K = Kit, { prog, smooth, outBack, outCubic, lerp, C } = K;

const Y3 = -14, Y4 = -28, Y5 = -42;
const INK = C.css.navy, RED = C.css.red, GREEN = C.css.green;
const HAND = 'italic 600 64px Caladea';

const S = K.stage({
  duration: 29,
  captionBox: true,
  captions: [
    [0.0, 1.5, `Why are your maths grades`],
    [1.5, 3.2, `<span class="neg">lower</span> than they should be?`],
    [3.2, 4.6, `Reason 1: you're throwing away <span class="gold">method marks.</span>`],
    [4.6, 6.6, `Answer only. Wrong. <span class="neg">0 marks.</span>`],
    [6.6, 8.6, `Now show the <span class="gold">working…</span>`],
    [8.6, 11.6, `Same wrong answer. <span class="pos">2 marks.</span>`],
    [11.6, 12.9, `Reason 2: you <span class="gold">re-read</span> your notes.`],
    [12.9, 13.9, `It <span class="neg">feels</span> like revision.`],
    [13.9, 15.3, `Testing yourself <span class="pos">actually is.</span>`],
    [15.3, 16.8, `One of the most <span class="gold">proven</span> ideas in learning science.`],
    [16.8, 18.6, `Reason 3: you make the <span class="neg">same mistake</span> twice.`],
    [18.6, 20.0, `Every wrong answer has a <span class="gold">reason.</span>`],
    [20.0, 21.4, `Know it, and you <span class="pos">won't repeat it.</span>`],
    [21.6, 23.0, `Do your <span class="gold">5 a day.</span>`, 1500],
    [23.0, 24.6, `8,000+ real <span class="gold">GCSE &amp; A-level</span> exam questions.`, 1500],
    [24.6, 26.1, `Every wrong answer tells you <span class="gold">why.</span>`, 1500],
    [26.1, 29.01, `Maths <span class="gold">Quest</span>`, 1440],
  ],
});
const { scene } = S;

// canvas point on a textured plane → world position
function planePoint(mesh, cx, cy, pw, ph, w, h) {
  mesh.updateWorldMatrix(true, false);
  return mesh.localToWorld(new THREE.Vector3((cx / pw - 0.5) * w, (0.5 - cy / ph) * h, 0.01)).toArray();
}
function writeOn(c, text, x, y, p, font = HAND, color = INK) {
  if (p <= 0) return;
  c.save(); c.font = font; c.fillStyle = color;
  const w = c.measureText(text).width;
  c.beginPath(); c.rect(x - 10, y - 90, (w + 20) * p, 130); c.clip(); c.fillText(text, x, y); c.restore();
}
function ringMark(c, x, y, r, color, text, font) {
  c.save(); c.strokeStyle = color; c.lineWidth = 7; c.beginPath(); c.ellipse(x, y, r * 1.15, r, -0.12, 0, Math.PI * 2); c.stroke();
  c.fillStyle = color; c.font = font; c.textAlign = "center"; c.fillText(text, x, y + r * 0.36); c.restore();
}

// ---------- shots 1–2: the exam paper ----------
const PW = 1020, PH = 1440, PAPER_W = 3.4, PAPER_H = 4.8;
const paper = new THREE.Group(); paper.scale.setScalar(0.72); scene.add(paper);
paper.add(K.outline(new THREE.Mesh(K.roundedBox(PAPER_W, PAPER_H, 0.03, 0.012), K.mats.cream()), 0.03));
const cover = K.plane(PAPER_W, PAPER_H, PW, PH, (c, w, h) => {
  c.fillStyle = C.css.cream; c.fillRect(0, 0, w, h);
  c.fillStyle = C.css.navy; c.fillRect(0, 0, w, 150);
  c.fillStyle = "#fff"; c.font = '800 54px Bricolage'; c.fillText("GCSE Mathematics", 70, 98);
  c.fillStyle = C.css.ink; c.font = '800 72px Bricolage'; c.fillText("Paper 1", 70, 300);
  c.font = '500 40px Bricolage'; c.fillStyle = "#5e5a50"; c.fillText("Non-calculator · 1 hour 30 minutes", 70, 360);
  c.strokeStyle = "#d6d1c2"; c.lineWidth = 3;
  ["Candidate name", "Centre number", "Candidate number"].forEach((l, i) => { c.fillStyle = "#5e5a50"; c.font = '500 34px Bricolage'; c.fillText(l, 70, 480 + i * 110); c.strokeRect(430, 438 + i * 110, 520, 64); });
  c.fillStyle = "#dedacd"; for (let i = 0; i < 9; i++) c.fillRect(70, 820 + i * 50, i % 3 === 2 ? 520 : 860, 20);
  c.font = '500 36px Bricolage'; c.fillStyle = "#5e5a50"; c.fillText("Target grade", 600, 1250);
  ringMark(c, 820, 1330, 70, RED, "4", 'italic 800 130px Caladea');
  c.fillStyle = RED; c.font = 'italic 600 54px Caladea'; c.fillText("Grade", 560, 1355);
  c.fillStyle = INK; c.font = 'italic 700 64px Caladea'; c.fillText("6", 870, 1252);
}, { lit: true });
cover.position.z = 0.016; paper.add(cover);

const back = K.plane(PAPER_W, PAPER_H, PW, PH, () => {}, { lit: true });
back.rotation.y = Math.PI; back.position.z = -0.016; paper.add(back);
const LINES = [
  { y: 600, text: "y(x + 1) = 3x − 5", at: 6.6, mark: 7.0 },
  { y: 730, text: "xy + y = 3x − 5", at: 7.2 },
  { y: 860, text: "y + 5 = x(3 − y)", at: 7.8, mark: 8.2 },
];
function drawQuestion(c, w, h, t) {
  c.fillStyle = C.css.cream; c.fillRect(0, 0, w, h);
  c.fillStyle = "#5e5a50"; c.font = '500 32px Bricolage'; c.fillText("Edexcel A-level · Specimen Paper 1", 70, 90);
  c.fillStyle = C.css.ink; c.font = '800 46px Bricolage'; c.fillText("Question 10", 70, 160);
  c.font = '600 58px Bricolage'; c.fillText("f(x) =", 70, 290); K.frac(c, "3x − 5", "x + 1", 265, 275, 62);
  c.fillText("Find f⁻¹(x).", 70, 410); c.fillStyle = "#5e5a50"; c.fillText("(3)", 640, 410);
  c.fillStyle = "#d6d1c2"; c.fillRect(70, 470, 880, 4); c.fillRect(780, 500, 3, 640);
  LINES.forEach(L => {
    writeOn(c, L.text, 90, L.y, prog(t, L.at, L.at + 0.55));
    if (L.mark && t >= L.mark) { c.fillStyle = GREEN; c.font = '800 46px Bricolage'; c.fillText("M1 ✓", 810, L.y); }
  });
  // the final (wrong) answer is always there
  c.save(); c.font = HAND; c.fillStyle = INK; c.fillText("f⁻¹(x) =", 90, 1010); K.frac(c, "x + 5", "x − 3", 350, 990, 64); c.restore();
  if (t >= 4.6) { c.fillStyle = RED; c.font = '800 46px Bricolage'; c.fillText("A1 ✗", 810, 1010); }
  if (t >= 4.9 && t < 8.6) ringMark(c, 880, 230, 72, RED, "0/3", 'italic 800 64px Caladea');
  if (t >= 8.6) ringMark(c, 880, 230, 72, GREEN, "2/3", 'italic 800 64px Caladea');
}
// the paper's own half-turn cancels the back face's, so canvas coords map straight through
const bp = (cx, cy) => () => planePoint(back, cx, cy, PW, PH, PAPER_W, PAPER_H);
S.ring(1.7, 3.0, () => planePoint(cover, 820, 1330, PW, PH, PAPER_W, PAPER_H), 120);
S.ring(4.7, 5.9, bp(860, 995), 95);
S.ring(7.05, 7.9, bp(860, 585), 95);
S.ring(8.25, 8.9, bp(860, 845), 95);
S.ring(8.7, 10.4, bp(880, 230), 120);

// ---------- shot 3: re-reading vs testing ----------
const book = new THREE.Group(); book.position.set(-1.9, Y3, 0); scene.add(book);
const coverMat = K.mats.navy();
const notes = (c, w, h) => {
  c.fillStyle = "#f7f3e8"; c.fillRect(0, 0, w, h);
  c.fillStyle = "#cdc6b2"; for (let i = 0; i < 14; i++) c.fillRect(40, 70 + i * 52, i % 4 === 3 ? 200 : 360, 12);
  c.fillStyle = "rgba(255,230,0,.55)"; [1, 2, 5, 9, 10].forEach(i => c.fillRect(30, 56 + i * 52, 380, 34));
};
function bookHalf(side) {
  const g = new THREE.Group();
  const cv = new THREE.Mesh(K.roundedBox(1.7, 2.3, 0.08, 0.03), coverMat); cv.position.set(side * 0.85, 0, -0.08);
  const pg = K.outline(new THREE.Mesh(K.roundedBox(1.6, 2.2, 0.1, 0.02), K.mats.cream()), 0.025); pg.position.set(side * 0.82, 0, 0);
  const face = K.plane(1.56, 2.16, 440, 800, notes, { lit: true }); face.position.set(side * 0.82, 0, 0.051);
  g.add(cv, pg, face); return g;
}
const bookL = bookHalf(-1), bookR = bookHalf(1); book.add(bookL, bookR);
const greyCol = new THREE.Color(0x9a958a), blueCol = new THREE.Color(C.navy);

const stack = new THREE.Group(); stack.position.set(1.9, Y3, 0); scene.add(stack);
const sheets = [0, 1, 2, 3].map(i => {
  const g = new THREE.Group();
  g.add(K.outline(new THREE.Mesh(K.roundedBox(1.7, 2.3, 0.02, 0.008), K.mats.cream()), 0.025));
  const f = K.plane(1.7, 2.3, 340, 460, (c, w, h) => {
    c.fillStyle = C.css.cream; c.fillRect(0, 0, w, h);
    c.fillStyle = C.css.ink; c.font = '800 30px Bricolage'; c.fillText(`Q${i + 3}`, 26, 50);
    c.fillStyle = "#d6d1c2"; for (let k = 0; k < 6; k++) c.fillRect(26, 80 + k * 30, k % 3 === 2 ? 160 : 280, 10);
    c.fillStyle = C.css.navy; c.font = 'italic 600 34px Caladea'; c.fillText(["x = 7", "y = 2x − 3", "48 cm²", "x = −2, 5"][i], 30, 330);
    c.fillStyle = C.css.green; c.font = '800 64px Bricolage'; c.fillText("✓", 255, 420);
  }, { lit: true });
  f.position.z = 0.011; g.add(f); stack.add(g); return g;
});
const sheetGlow = new THREE.Mesh(K.roundedBox(1.9, 2.5, 0.01, 0.005), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
sheetGlow.position.z = -0.1; stack.add(sheetGlow);

// ---------- shot 4: repeated mistakes ----------
const MISTAKES = [
  { f: ["x + 5", "x − 3"], tag: "sign error" },
  { t: "g(x) ≥ −2.25", tag: "wrong domain" },
  { f: ["x + 1", "3x − 5"], tag: "found 1/f(x)" },
];
const cards = MISTAKES.map((m, i) => {
  const g = new THREE.Group();
  const edge = K.outline(new THREE.Mesh(K.roundedBox(3.36, 1.18, 0.1, 0.07), K.mats.red()), 0.03);
  const body = new THREE.Mesh(K.roundedBox(3.2, 1.02, 0.16, 0.05), K.mats.cream());
  const f = K.plane(3.1, 0.95, 930, 285, (c, w, h) => {
    c.fillStyle = C.css.ink; c.font = '400 62px Caladea';
    if (m.f) K.frac(c, m.f[0], m.f[1], 40, 150, 72); else c.fillText(m.t, 40, 170);
    c.textAlign = "right"; c.fillStyle = C.css.red; c.font = '800 52px Bricolage'; c.fillText(m.tag, w - 40, 165);
  });
  f.position.z = 0.085; g.add(edge, body, f); g.edge = edge; g.face = f;
  scene.add(g); return g;
});
const CARD_Y = [1.35, 0, -1.35], CARD_AT = [17.1, 17.6, 18.1];
S.ring(18.7, 19.9, () => planePoint(cards[0].face, 770, 145, 930, 285, 3.1, 0.95), 110);

// ---------- shot 5: the app ----------
const APP = { start: 22.9, push: 23.0, wrong: 24.0, right: 25.4 };
const quiz = K.mqQuestion({
  question: [[["Given ", "sans"], ["f(x) = (3x − 5)/(x + 1),", "serif"]], [["find ", "sans"], ["f⁻¹(x).", "serif"]]],
  options: [{ frac: ["x + 5", "x − 3"] }, { frac: ["x + 5", "3 − x"] }, { frac: ["2x + 5", "3 − x"] }, { frac: ["x + 1", "3x − 5"] }],
  why: ["Not quite: sign error", "−(x + 5)/(x − 3) = (x + 5)/(3 − x)"],
  good: ["Nice one!", "Full marks: M1, M1, A1."],
});
const ph = K.phone(() => {}); ph.scale.setScalar(0.92); scene.add(ph);
let screen = () => {}, brand;
S.ring(22.4, 23.1, () => K.screenPoint(ph, ...brand.startPoint), 115);
S.ring(APP.wrong, APP.wrong + 0.8, () => K.screenPoint(ph, ...quiz.markPoint(0)), 60);
S.ring(APP.right, APP.right + 0.9, () => K.screenPoint(ph, ...quiz.markPoint(1)), 60);
const btn = K.el("div", "btn", S.ov, "Get Maths Quest free"); btn.style.top = "1620px";
const bio = K.el("div", "cap dim", S.ov, "link in bio"); bio.style.cssText += "top:1790px;font-size:36px;font-weight:600";

const CAM = [
  { t: 0, pos: [0, 0.2, 13], look: [0, 0, 0] },
  { t: 2.9, pos: [0.6, 0, 10.5], look: [0, 0, 0] },
  { t: 4.4, pos: [0, 0, 9.2], look: [0, 0, 0], dur: 1.2 },
  { t: 7.2, pos: [-0.1, 0, 8.2], look: [-0.1, 0, 0], dur: 0.6 },
  { t: 9.2, pos: [0.7, 1.0, 3.6], look: [0.89, 1.18, 0], dur: 0.6 },
  { t: 11.0, pos: [0.6, 0.9, 3.9], look: [0.89, 1.18, 0] },
  { t: 12.1, pos: [-1.9, Y3 + 0.6, 9.5], look: [-1.9, Y3, 0], dur: 0.5 },
  { t: 13.7, pos: [-1.6, Y3 + 0.5, 9.2], look: [-1.8, Y3, 0] },
  { t: 14.4, pos: [1.9, Y3 + 0.5, 9.0], look: [1.9, Y3, 0], dur: 0.6 },
  { t: 15.3, pos: [1.8, Y3 + 0.5, 8.6], look: [1.9, Y3, 0] },
  { t: 16.5, pos: [0, Y3 + 1.0, 13.5], look: [0, Y3, 0], dur: 1.0 },
  { t: 17.3, pos: [0.6, Y4 + 0.4, 11], look: [0, Y4, 0], dur: 0.5 },
  { t: 21.4, pos: [-0.4, Y4 + 0.2, 9.2], look: [0, Y4, 0] },
  { t: 22.1, pos: [0, Y5 + 0.6, 16], look: [0, Y5 + 0.9, 0], dur: 0.6 },
  { t: 29, pos: [0, Y5 + 0.6, 15.4], look: [0, Y5 + 0.9, 0] },
];

S.onFrame(t => {
  S.camPath(t, CAM);

  // paper: floats, then flips to the question side at 3.0
  const flip = smooth(prog(t, 3.0, 3.7));
  paper.rotation.set(-0.12 * (1 - flip) + Math.sin(t * 0.9) * 0.03, flip * Math.PI + Math.sin(t * 0.6) * 0.18 * (1 - flip) + Math.sin(t * 0.5) * 0.04, 0.05 * (1 - flip));
  paper.position.y = Math.sin(t * 1.3) * 0.06;
  back.tex.redraw((c, w, h) => drawQuestion(c, w, h, t),
    t < 6.6 || t > 8.4 ? `${t >= 4.6}${t >= 4.9}${t >= 8.6}${t >= 6.6}` : Math.round(t * 30));

  // book: open → closes and greys out
  const close = smooth(prog(t, 13.1, 13.7));
  bookR.rotation.y = -close * Math.PI * 0.97;
  coverMat.color.copy(blueCol).lerp(greyCol, prog(t, 13.3, 13.8));
  book.rotation.set(-0.25 + Math.sin(t) * 0.03, 0.25, 0);
  book.scale.setScalar(1 - 0.12 * prog(t, 13.3, 13.8));
  // stack fans out and glows
  const fan = outBack(prog(t, 14.0, 14.7));
  sheets.forEach((g, i) => {
    const k = i - 1.5;
    g.position.set(k * 0.35 * fan, Math.abs(k) * -0.08 * fan, i * 0.03);
    g.rotation.z = -k * 0.16 * fan;
  });
  stack.rotation.set(-0.2, -0.25 + Math.sin(t * 0.8) * 0.05, 0);
  sheetGlow.material.opacity = 0.45 * prog(t, 14.2, 14.8) * (0.8 + 0.2 * Math.sin(t * 4));

  // cards tumble in, edges cool from red to gold once you know the reason
  cards.forEach((g, i) => {
    const p = prog(t, CARD_AT[i], CARD_AT[i] + 0.6), e = outBack(p);
    g.position.set((i - 1) * 0.15, Y4 + CARD_Y[i] + (1 - outCubic(p)) * 6, (1 - p) * 2);
    g.rotation.set((1 - e) * 1.6 + Math.sin(t * 1.1 + i) * 0.05, Math.sin(t * 0.7 + i) * 0.12, (1 - e) * (i - 1) * 0.8 + (i - 1) * 0.04);
    const fix = prog(t, 20.0 + i * 0.2, 20.4 + i * 0.2);
    g.edge.material.color.set(C.red).lerp(new THREE.Color(C.green), fix);
  });

  // phone
  const fly = outCubic(prog(t, 21.5, 22.4));
  ph.position.set(0, Y5 - (1 - fly) * 7 + Math.sin(t * 1.4) * 0.08, (1 - fly) * -3);
  ph.rotation.set((1 - fly) * 0.6, lerp(1.4, -0.22, fly) + prog(t, 22.4, 29) * 0.3, (1 - fly) * 0.25);
  screen(t);
  const b = prog(t, 26.2, 26.6);
  btn.style.opacity = b; bio.style.opacity = b;
  btn.style.transform = `scale(${0.8 + 0.2 * outBack(b) + (t > 26.6 ? Math.sin((t - 26.6) * 4) * 0.025 : 0)})`;
});
K.loadBrand("../lib/").then(b => { brand = b; S.refreshTextures(); screen = K.mqScript(ph, quiz, b.fiveADay, APP); S.start(); });
</script>
</body>
</html>
